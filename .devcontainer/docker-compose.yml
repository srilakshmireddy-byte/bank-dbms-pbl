services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:22
    volumes:
      - ..:/workspaces/${localWorkspaceFolderBasename}:cached
    command: sleep infinity
    depends_on:
      - db
  db:
    image: mysql:8.0
    restart: unless-stopped
    # mysql_native_password so the plain `mysql` command-line client can connect too
    command: --default-authentication-plugin=mysql_native_password
    environment:
      # Throwaway password for a disposable Codespace database; it is not reachable from outside.
      MYSQL_ROOT_PASSWORD: codespace-only
    volumes:
      - dbdata:/var/lib/mysql
volumes:
  dbdata:
