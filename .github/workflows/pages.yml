# Publishes the Woxsen Co-operative Bank demo to GitHub Pages: the real front end plus an in-page
# copy of the back end (public/js/demo.js), so no server or database is needed.
# Turn it on once: Settings > Pages > Source = "GitHub Actions". Then every push to main redeploys.
name: Deploy bank demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the demo
        working-directory: review-3
        run: node scripts/build-pages.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: review-3/pages-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
